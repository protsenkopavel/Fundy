name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run code quality checks
        run: ./gradlew check

      - name: Upload checkstyle report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkstyle-report
          path: build/reports/checkstyle/

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: quality-check

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/fundy:latest
            ghcr.io/${{ github.repository_owner }}/fundy:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./fundy-frontend
          file: ./fundy-frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/fundy-frontend:latest
            ghcr.io/${{ github.repository_owner }}/fundy-frontend:${{ github.sha }}

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.0
        env:
          GHCR_PAT: ${{ secrets.REGISTRY_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_IP }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: GHCR_PAT
          script: |
            set -e
            WORKDIR=/home/prots/fundy

            [ -d "$WORKDIR/.git" ] || git clone https://github.com/protsenkopavel/Fundy "$WORKDIR"
            cd "$WORKDIR"
            git pull --rebase

            [ -f .env ] || { echo ".env не найден – abort"; exit 1; }

            echo "$GHCR_PAT" | docker login ghcr.io -u protsenkopavel --password-stdin

            docker compose -f compose.yaml -f compose.prod.yaml pull
            docker compose -f compose.yaml -f compose.prod.yaml up -d --remove-orphans
            docker image prune -f